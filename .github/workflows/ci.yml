# Pipeline por PR (PLAN §12). Durante la F0a solo existen los pasos 1–5, y cada uno
# bloquea la fusión; el job `Compuertas` verifica que cada uno falla cuando debe.
# Las acciones se fijan por SHA de commit (§7). `deploy.yml` lo reutiliza para repetir
# los pasos al fusionar en `main` (§12).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # En `main` no se cancela: cada fusión debe completar su despliegue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  pasos:
    name: Pasos 1-5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: la comprobación de procedencia recorre los commits de la PR.
          fetch-depth: 0
          persist-credentials: false

      - name: pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 1. Instalación
        run: pnpm install --frozen-lockfile

      - name: 2. Tipos
        run: pnpm check

      - name: 3. Estilo, fronteras y procedencia
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          pnpm lint
          pnpm format:check
          # En una PR, sus commits; al fusionar en `main`, todo el historial.
          if [ -n "$BASE_REF" ]; then
            pnpm provenance "origin/$BASE_REF"
          else
            pnpm provenance
          fi

      - name: 4. Pruebas unitarias
        run: pnpm test:coverage

      - name: 5. Build
        run: pnpm build

      # El job de despliegue recibe `dist/` como artefacto y no ejecuta código del
      # proyecto (§7).
      - name: Artefacto dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Pruebas negativas (§12, principio 4): cada caso de `tests/gates/` debe hacer
  # fallar su compuerta. Corre en paralelo con los pasos 1-5.
  compuertas:
    name: Compuertas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalación
        run: pnpm install --frozen-lockfile

      - name: Pruebas negativas de los pasos 1-5
        run: pnpm gates
