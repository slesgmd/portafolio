# Despliegue a producción al fusionar en `main` (PLAN §12). Durante la F0a repite los
# pasos 1-5 y ejecuta `wrangler deploy`; la prueba de humo y la vuelta atrás llegan en
# la F0b (tarea 0.12). Las acciones se fijan por SHA de commit (§7).
name: Despliegue

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: despliegue-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Único job con el token de Cloudflare (§7). No ejecuta código del proyecto: recibe
  # `dist/` como artefacto, solo descarga los archivos que fijan la versión de wrangler
  # y su configuración, e instala sin scripts.
  despliegue:
    name: wrangler deploy
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Entorno restringido a `main`; guarda el token y el ID de la cuenta.
    environment: production
    steps:
      - name: Checkout (solo manifiestos y configuración de wrangler)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /pnpm-lock.yaml
            /pnpm-workspace.yaml
            /.nvmrc
            /wrangler.jsonc

      - name: pnpm (versión de packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Sin caché: este job no reutiliza nada que haya escrito un job con código del
      # proyecto.
      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalación (wrangler en la versión del lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Artefacto dist/
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "main $GITHUB_SHA"
