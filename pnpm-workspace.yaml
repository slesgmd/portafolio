# Configuración de pnpm (ADR 0002). `.npmrc` solo se usa para autenticación y registro.

# Edad mínima de publicación: 7 días, en minutos (§7, §11).
minimumReleaseAge: 10080

# Versiones exactas en package.json; Renovate las actualiza.
savePrefix: ''

# Falla si la versión de Node no cumple `engines`.
engineStrict: true

# Scripts de instalación: pnpm los bloquea por defecto (strictDepBuilds). La lista
# blanca `allowBuilds` va aquí cuando una dependencia lo necesite, justificada en un ADR.
# Hoy ninguna lo necesita.

# Overrides (ADR 0005). Cada uno indica cuándo se retira.
overrides:
  # ESLint 10 eliminó `context.getPhysicalFilename()`; eslint-module-utils 2.12.1,
  # fijada por eslint-plugin-boundaries 7.2.0, resuelve entonces los imports de los
  # bloques `<script>` de `.astro` desde su ruta virtual. La 2.14.0 lee
  # `context.physicalFilename`. Se retira cuando boundaries dependa de ella o de una
  # posterior.
  eslint-plugin-boundaries>eslint-module-utils: 2.14.0
